plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// ─── 正式签名：从 keystore.properties 读取密钥信息（该文件不入库）───
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'io.github.fgozxy.await'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.fgozxy.await"
        minSdk 26
        targetSdk 34
        versionCode 44
        versionName "2.6.0"
    }

    def environmentSigning = System.getenv("AWAIT_SIGNING_STORE_FILE") != null
    def hasReleaseSigning = environmentSigning || keystorePropsFile.exists()
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(environmentSigning ? System.getenv('AWAIT_SIGNING_STORE_FILE') : keystoreProps['storeFile'])
                storePassword environmentSigning ? System.getenv('AWAIT_SIGNING_STORE_PASSWORD') : keystoreProps['storePassword']
                keyAlias environmentSigning ? System.getenv('AWAIT_SIGNING_KEY_ALIAS') : keystoreProps['keyAlias']
                keyPassword environmentSigning ? System.getenv('AWAIT_SIGNING_KEY_PASSWORD') : keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }

    // 输出文件名带上版本号
    android.applicationVariants.all { variant ->
        variant.outputs.all { outputFileName = "Await-v${variant.versionName}.apk" }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5'

    implementation 'androidx.compose.ui:ui:1.7.0'
    implementation 'androidx.compose.foundation:foundation:1.7.0'
    implementation 'androidx.compose.material3:material3:1.3.0'
    implementation 'androidx.compose.material:material-icons-extended:1.7.0'

    implementation 'cn.6tail:lunar:1.7.7'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    testImplementation 'junit:junit:4.13.2'
}
